<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>比斯泰德 · iPhone 安裝</title>
    <link rel="apple-touch-icon" href="../brand/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 80% at 30% 0%, #12343b 0%, #071a20 70%);
        color: #e6f2ed;
        font:
          16px/1.7 system-ui,
          -apple-system,
          'PingFang TC',
          sans-serif;
      }
      main {
        width: min(460px, calc(100vw - 32px));
        padding: 28px 24px;
        border-radius: 20px;
        background: #0a2229e6;
        border: 1px solid #9ce8d140;
        box-shadow: 0 24px 60px #000a;
      }
      header {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      header img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      header p {
        margin: 0;
        color: #9dbdb6;
        font-size: 14px;
      }
      a.install {
        display: block;
        margin: 22px 0 18px;
        padding: 14px;
        border-radius: 12px;
        text-align: center;
        font-weight: 700;
        color: #062027;
        background: #9ce8d1;
        text-decoration: none;
      }
      ol {
        margin: 0;
        padding-left: 1.2em;
      }
      li {
        margin: 6px 0;
      }
      small {
        display: block;
        margin-top: 16px;
        color: #8fb3ad;
        font-size: 13px;
      }
      b {
        color: #9ce8d1;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../brand/apple-touch-icon.png" alt="" />
        <div>
          <h1>比斯泰德 Beastidal</h1>
          <p>《御獸與遠航》· iPhone / iPad</p>
        </div>
      </header>
      <a class="install" href="./beastidal.mobileconfig">下載描述檔</a>
      <ol>
        <li>請用 <b>Safari</b> 開啟這一頁，點上面的「下載描述檔」，選「允許」。</li>
        <li>打開「<b>設定</b>」，最上方會出現「已下載描述檔」，點進去。</li>
        <li>按「<b>安裝</b>」，輸入手機密碼，再按一次「安裝」。</li>
        <li>回到主畫面，點「<b>比斯泰德</b>」圖示，就會全螢幕開始遊玩。</li>
      </ol>
      <small
        >描述檔只會在主畫面加一個遊戲圖示，不會讀取或變更手機的其他設定；它沒有經過 Apple
        簽署，所以會顯示「未簽署」，這是正常的。不想要時，到「設定 › 一般 › VPN
        與裝置管理」移除即可。進度保存在這支手機上。</small
      >
    </main>
  </body>
</html>
