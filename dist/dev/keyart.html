<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Key art</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      // Renders one key-art portrait (0.30) for dist/art/: ?key=beast-<id> or ?key=look-<element>-<plan>.
      // scripts/render-keyart.mjs drives it and saves window.keyart (a WebP data URL).
      import * as T from '../vendor/three.module.min.js';
      import { makeCreature, animateCreature } from '../creatures.js?v=0.61.1';
      import { makeGenome } from '../genetics.js?v=0.61.1';
      import { applyGeneMarks, animateMarks } from '../bs-models.js?v=0.61.1';
      import { LOOKS } from '../beast-look.js?v=0.61.1';
      import { WILD_BEASTS, makeWildBeast } from '../beasts.js?v=0.61.1';
      import { loadSculpts } from '../sculpt-assets.js?v=0.61.1';
      import { makeSky } from '../realism.js?v=0.61.1';
      import { PostFX } from '../postfx.js?v=0.61.1';
      import { makeSabertooth, animateSabertooth } from '../story-models.js?v=0.61.1';
      await loadSculpts();
      const q = new URLSearchParams(location.search),
        key = q.get('key') || 'beast-flamemaw',
        W = Number(q.get('w') || 1536),
        H = Number(q.get('h') || 1024);
      // the genome: a wild beast as the game makes it, or an evolved land beast of an element
      let genome, rim, sea;
      const GENES = {
        ember: ['fire', 'hardbody', 'greatjaw'],
        bone: ['hardbody', 'boneplates', 'tailclub'],
        storm: ['lightning', 'staticfur', 'spikes'],
        venom: ['venomfang', 'venomspine', 'inkjet'],
        frost: ['frostbreath', 'crystalhorn', 'coldheart'],
        shadow: ['ghosteyes', 'nightsight', 'camouflage'],
        crystal: ['crystalcore', 'crystalhorn', 'resonant'],
        verdant: ['vinewhip', 'barkskin', 'photoskin']
      };
      let seed = 1;
      for (const ch of key) seed = (seed * 31 + ch.charCodeAt(0)) % 1e9;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const myth = key === 'myth-xiaoyue';
      if (myth) {
        genome = makeGenome(2718281, 2, 'land');
        rim = 0xffc46a;
      } else if (key.startsWith('beast-')) {
        const id = key.slice(6);
        genome = makeWildBeast(id, rnd).genome;
        sea = WILD_BEASTS[id].kind !== 'land';
      } else {
        const el = key.split('-')[1];
        genome = makeGenome(Math.floor(rnd() * 1e9), 0, 'land');
        genome.bs = GENES[el] || GENES.shadow;
        genome.temper = [230, 230];
        rim = LOOKS[el]?.rim;
      }
      const canvas = document.getElementById('c'),
        renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      const scene = new T.Scene();
      scene.background = new T.Color(sea ? 0x06141c : 0x12080c);
      scene.fog = new T.FogExp2(sea ? 0x0b2230 : 0x2a1016, 0.045);
      const sky = makeSky();
      sky.material.uniforms.uSunDir.value.set(-0.3, 0.25, -0.6).normalize();
      const env = new T.Scene();
      sky.scale.setScalar(0.1);
      env.add(sky);
      scene.environment = new T.PMREMGenerator(renderer).fromScene(env, 0, 0.1, 100).texture;
      scene.environmentIntensity = 0.35;
      // (0.36.5: 嘯岳, the mythic sabre-tooth, is its own model)
      const m = myth ? makeSabertooth() : makeCreature(genome);
      if (!myth) applyGeneMarks(m, genome, 'beast');
      if (m.userData.perch) m.userData.perch.visible = false;
      m.rotation.y = -0.55;
      scene.add(m);
      for (let i = 0; i < 6; i++) myth ? animateSabertooth(m, 1.3 + i * 0.03) : animateCreature(m, 1.3 + i * 0.03);
      m.updateMatrixWorld(true);
      const box = new T.Box3();
      m.traverse(o => o.isMesh && o.visible && box.expandByObject(o));
      const centre = box.getCenter(new T.Vector3()),
        size = box.getSize(new T.Vector3()).length(),
        lookRim = new T.Color(rim || (sea ? 0x5ab8ff : 0xff4a1e));
      // ground: wet dark rock for land beasts, a black water plane for the rest
      const ground = new T.Mesh(
        new T.CircleGeometry(size * 4, 64),
        new T.MeshStandardMaterial({ color: sea ? 0x06121a : 0x120a0a, roughness: 0.92, metalness: 0 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = box.min.y + (sea ? -0.15 : 0);
      ground.receiveShadow = true;
      scene.add(ground);
      // lighting: a warm low key, a strong coloured rim from behind, a cold fill
      scene.add(new T.HemisphereLight(0x6a5070, 0x080406, 0.35));
      const key_ = new T.DirectionalLight(0xffd2b0, 2.4);
      key_.position.set(centre.x + size * 1.2, centre.y + size * 0.9, centre.z + size * 1.4);
      key_.target.position.copy(centre);
      key_.castShadow = true;
      key_.shadow.mapSize.set(2048, 2048);
      const sc = key_.shadow.camera;
      sc.left = sc.bottom = -size;
      sc.right = sc.top = size;
      sc.far = size * 6;
      scene.add(key_, key_.target);
      for (const sd of [-1, 1]) {
        const r = new T.DirectionalLight(lookRim, 4.5);
        r.position.set(centre.x + sd * size * 1.1, centre.y + size * 0.5, centre.z - size * 1.6);
        r.target.position.copy(centre);
        scene.add(r, r.target);
      }
      const fill = new T.DirectionalLight(0x7aa8ff, 0.55);
      fill.position.set(centre.x - size * 1.2, centre.y + size * 0.2, centre.z + size * 0.6);
      fill.target.position.copy(centre);
      scene.add(fill, fill.target);
      // a low, slightly heroic three-quarter view
      const camera = new T.PerspectiveCamera(32, W / H, 0.05, size * 20);
      camera.position.set(centre.x + size * 0.62, centre.y + size * 0.05, centre.z + size * 1.15);
      camera.lookAt(centre.x, centre.y + size * 0.04, centre.z);
      const post = new PostFX(renderer, 'high');
      post.setSize(W, H);
      post.focus = camera.position.distanceTo(centre);
      post.warmth = sea ? 0.4 : 1;
      for (let i = 0; i < 4; i++) {
        if (!myth) animateMarks(m, 1.3 + i * 0.05);
        post.render(scene, camera, 0.4);
      }
      window.keyart = canvas.toDataURL('image/webp', 0.9);
      window.keyartReady = true;
    </script>
  </body>
</html>
